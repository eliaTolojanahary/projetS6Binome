version: '3.7'

services:
  web:
    build:
      context: .
    image: projets6-web
    container_name: projetS6-web
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: projetS6-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: guerreNews
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/database_guerre_iran.sql:/docker-entrypoint-initdb.d/database_guerre_iran.sql:ro

volumes:
  db_data: